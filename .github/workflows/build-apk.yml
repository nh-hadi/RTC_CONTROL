name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Flutter APK (arm64)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./   # pubspec.yaml ada di root repo

    steps:
      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Java 17 (wajib untuk Android build tools)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Flutter — TIDAK pakai flutter-version, hanya channel
      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 4. Verifikasi versi Flutter
      - name: Flutter Version
        run: flutter --version

      # 5. Install dependencies
      - name: Flutter Pub Get
        run: flutter pub get

      # 5. Analyze — hanya error fatal yang gagalkan build (warning/info diabaikan)
      - name: Flutter Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      # 7. Build APK arm64-v8a saja (paling kecil, cocok HP modern)
      - name: Build APK arm64-v8a
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --target-platform android-arm64

      # 8. Cari & rename APK
      - name: Rename APK
        run: |
          mkdir -p output
          find build/app/outputs/flutter-apk/ -name "*arm64*.apk" | head -1 \
            | xargs -I{} cp {} output/IDS-RTC-Controller.apk
          echo "=== APK Info ==="
          ls -lh output/

      # 9. Upload artifact (tersedia 30 hari di tab Actions)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IDS-RTC-Controller-APK
          path: output/IDS-RTC-Controller.apk
          retention-days: 30
          if-no-files-found: error

  # ── Auto-release ke GitHub Releases saat push ke main ──────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-apk
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: IDS-RTC-Controller-APK
          path: output/

      - name: Get Version
        id: ver
        run: |
          VER=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr -d '\r')
          SEMVER=${VER%%+*}
          echo "tag=v${SEMVER}-build.${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "name=IDS-RTC Controller v${SEMVER} (Build ${{ github.run_number }})" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.name }}
          body: |
            ## IDS-RTC Controller — Android APK

            **Download:** `IDS-RTC-Controller.apk` di bawah.

            > APK ini untuk HP Android 64-bit (arm64-v8a) — semua HP Android 2017+.

            ### Cara Pakai
            1. Upload firmware ke ESP → WiFi AP: `IDS_RTC_AP` / password: `12345678`
            2. Sambungkan HP ke WiFi `IDS_RTC_AP`
            3. Buka app, IP default: `192.168.4.1`
          files: output/IDS-RTC-Controller.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
